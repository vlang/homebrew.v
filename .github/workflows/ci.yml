name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VTEST_FAIL_FAST: "1"
      VJOBS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup V
        id: setup_v
        uses: vlang/setup-v@v1
      - name: Install dependencies
        id: install_deps
        if: ${{ success() && !cancelled() && steps.setup_v.outcome == 'success' }}
        run: v install --once
      - name: Vet
        id: vet
        if: ${{ success() && !cancelled() && steps.install_deps.outcome == 'success' }}
        run: v vet .
      # keg_relocate_macho_test.v does not compile, so only the verified
      # translation integrity test runs here until that is fixed.
      - name: Test
        id: test
        if: ${{ success() && !cancelled() && steps.vet.outcome == 'success' }}
        run: v test tests/translation_integrity_test.v
